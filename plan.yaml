meta:
  project_name: "pyarty"
  description: >
    A two-way contract between directory trees and Python dataclasses. Fields
    declare where they live with bidirectional relative path patterns, so a
    bundle can be written to disk and read back into the same class.
  iteration: "v0.2-bidirectional"
  updated: "2026-09-18"

purpose:
  problem: >
    Pipeline outputs, experiment bundles, and structured result directories are
    built with ad-hoc path juggling. The previous iteration of pyarty could
    only render dataclasses to disk: naming used str.format templates, which
    have no inverse, so a value baked into a filename was unrecoverable and
    reading a tree could only produce a freshly generated look-alike class
    rather than the one already declared.
  goals:
    - "Make read the exact inverse of write, for the user's own class."
    - "Express placement as one bidirectional path pattern per field."
    - "Pick serialization from the declared annotation, never the runtime value."
    - "Reject layouts that cannot round-trip at class-declaration time."
    - "Keep the base installation dependency-free."
  non_goals:
    - "No workflow execution, DAGs, or pipeline scheduling."
    - "No remote/object-store backends in this iteration."
    - "No schema migration between incompatible layouts."
  users:
    - "Data engineers writing pipeline output bundles."
    - "Researchers generating reproducible analysis output trees."
    - "Library authors defining reusable fixture or test directory layouts."
    - "AI agents generating or consuming structured output schemas."

design:
  core_insight: >
    Invertibility is the whole product. A str.format template can only render;
    a pattern can render *and* parse. Making PathPattern the single source of
    truth for placement is what allows Bundle.read(Bundle.write(x)) == x, and
    it removes the need for any naming-hint configuration.
  field_kinds:
    - "File[T]: one file; T selects the codec."
    - "Dir[T]: one subdirectory described by another bundle."
    - "Dir[list[T]]: one subdirectory per element; pattern must vary per child."
    - "Any other annotation: a plain value, captured from a pattern variable."
  variable_resolution: >
    Pattern variables resolve against the object being named: a File pattern
    against its owner, a Dir pattern against the child it names, falling back
    to the owner. This replaces the previous ("self" / "field") hint-source
    tuples, which required remembering which side a variable came from.
  strictness: >
    Write is strict and all-or-nothing: the full tree is planned and validated
    in memory before any byte is written, so a failure never leaves a partial
    directory. Read is lenient: unclaimed files are ignored and optional
    fields become None, because real trees carry extra files. strict=True
    asserts an exact match.

constraints:
  functional:
    - "`@bundle` converts a dataclass, resolves its layout, and attaches write/read/layout."
    - "`at(pattern)` declares placement; omitting it defaults to field name plus codec extension."
    - "An extension written into a pattern overrides the codec default."
    - "`Dir[list[T]]` whose final pattern segment has no variable raises LayoutError on declaration."
    - "Two fields resolving to one literal path raise LayoutError on declaration."
    - "A pattern variable naming no field raises SpecError on declaration."
    - "A pattern value containing a path separator raises PatternError, blocking traversal."
    - "Payloads are validated against their declared annotation before writing."
    - "`File[Path]` copies an existing file; a missing source is an error, not a warning."
    - "`scaffold_from_directory` emits editable Python source, collapsing repeated sibling shapes."
  non_functional:
    - "Python 3.11+, type-hint heavy, dataclass-first."
    - "No non-stdlib dependencies in the base package."
    - "Deterministic field and read ordering."
    - "Bundles declared inside functions resolve sibling references (caller scope is captured)."
  risks:
    - "Multi-variable segments rely on regex backtracking; adjacent variables with no separator are ambiguous."
    - "Codec coverage is deliberately small; unusual payloads fall back to JSON."
    - "Scaffolding infers from one example tree and may need hand-editing."

interfaces:
  public_api:
    - "bundle, at, File, Dir"
    - "write_bundle, read_bundle, plan_bundle"
    - "bundle_schema, is_bundle, BundleSchema, BundleField, FieldKind, PathSpec"
    - "PathPattern, Codec, codec_for_annotation"
    - "scaffold_from_directory"
  instance_api:
    - "instance.write(path, overwrite=False) -> Path"
    - "Cls.read(path, strict=False) -> instance"
    - "Cls.layout() -> str"
  errors:
    - "PyartyError (base)"
    - "PatternError (malformed pattern or value)"
    - "SpecError (bad declaration); LayoutError (non-round-trippable layout)"
    - "PayloadTypeError (value contradicts annotation, on write)"
    - "WriteError / ReadError; MissingFileError (required field absent)"

architecture:
  style: "layered, schema-first, dependency-free"
  components:
    - "pattern: PathPattern — format, match, glob, introspection"
    - "codecs: annotation -> Codec (extension, encode, decode, accepts)"
    - "schema: File/Dir/at/@bundle, resolution and declaration-time validation"
    - "writer: plan then execute; strict payload validation"
    - "reader: schema-driven discovery; lenient by default"
    - "scaffold: directory -> editable bundle source"
    - "errors: one hierarchy, messages naming field/type/path"
  flow:
    - "Declare bundle -> @bundle resolves and validates layout -> instantiate."
    - "write: plan every file -> validate payloads -> execute."
    - "read: per field, glob then match -> decode by annotation -> fill values from captures."

technology:
  language: "Python 3.11+"
  libraries: ["Standard library only"]
  storage: ["Local filesystem"]
  deployment_target: "Local, CI, Docker environments"

development:
  testing:
    - "test_pattern: format/match are exact inverses; malformed patterns rejected."
    - "test_roundtrip: full write/read cycles per layout and per codec; byte identity."
    - "test_schema: declaration-time validation and error message content."
    - "test_writer: strict payload validation, atomicity, overwrite, collections, copy."
    - "test_reader: leniency, strict mode, optionals, ambiguity, error messages."
    - "test_scaffold: generated source compiles, reads its own tree, inverts write."
  folder_structure:
    - "pyarty/{pattern,codecs,schema,writer,reader,scaffold,errors}.py"
    - "tests/"
  conventions:
    - "PEP8, type hints, dataclasses, pathlib everywhere."
    - "Patterns are always relative and '/'-separated on every platform."
    - "Errors name the field, the declared type, and the path."
    - "use pytest"

future:
  - "CLI for scaffold/validate/render workflows."
  - "Pluggable codec registry (Parquet/CSV/images)."
  - "fsspec backends (S3/GCS)."
  - "JSON Schema export for documentation and agent consumption."
  - "Glob-free indexed reads for very large trees."
